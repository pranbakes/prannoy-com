title: Bansho
description: >-
  The ed-tech company I founded and ran from 2020 to 2022. It launched as a
  short-form video app for teacher-creators, reached 80,000 downloads and the
  top 20 in App Store Education, then pivoted into a 1:1 tutoring marketplace
  that grew to close to $1M in annual recurring revenue. Acquisition costs
  outran the margins, and we sold to a larger tutoring company.
status: acquired
