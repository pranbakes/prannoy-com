title: Poetry on Receipts
description: >-
  Poems written on the backs of receipts, wherever I happen to be. They're
  instinctual, written in the moment rather than revised after, and
  together they've become a running log of the places I've been, the
  meals I've shared, and the conversations I've had. Posted to Instagram
  as they happen.
